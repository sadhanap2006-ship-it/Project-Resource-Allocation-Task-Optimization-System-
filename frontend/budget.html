<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Budget and Forecast - Project Resource Allocation System</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header" id="app-header"></header>
<nav class="app-nav" id="app-nav"></nav>

<main>
    <h2 class="page-title" id="page-title">Budget and Forecast</h2>
    <p class="page-hint" id="page-hint"></p>
    <div id="message-area"></div>

    <div class="card">
        <h3>Budget by project</h3>
        <div class="table-scroll"><table class="data-table">
            <thead><tr><th>Project</th><th>Total budget</th><th>Spent</th><th>Remaining</th><th style="width:22%">Utilization</th><th>Warning</th><th>Actions</th></tr></thead>
            <tbody id="budget-body"></tbody>
        </table></div>
    </div>

    <div class="card">
        <h3>Forecast and spending detail</h3>
        <div class="toolbar no-print">
            <div class="form-field"><label for="forecast-project">Project</label><select id="forecast-project"></select></div>
        </div>
        <div id="forecast-detail"></div>
    </div>

    <div class="card no-print">
        <h3>Record spending</h3>
        <form class="app-form" id="transaction-form">
            <div class="form-field"><label for="transaction-date">Date</label><input type="date" id="transaction-date" required></div>
            <div class="form-field"><label for="transaction-amount">Amount (Rs.)</label><input type="number" id="transaction-amount" min="0.01" step="0.01" required></div>
            <div class="form-field"><label for="transaction-category">Category</label><input type="text" id="transaction-category" placeholder="Salary"></div>
            <div class="form-field"><label for="transaction-description">Description</label><input type="text" id="transaction-description"></div>
            <div class="form-actions"><button type="submit">Add spending entry</button></div>
        </form>
    </div>

    <div class="card">
        <h3>Spending entries</h3>
        <div class="table-scroll"><table class="data-table">
            <thead><tr><th>Date</th><th>Amount</th><th>Category</th><th>Description</th></tr></thead>
            <tbody id="transaction-body"></tbody>
        </table></div>
    </div>
</main>

<script src="js/api.js"></script>
<script src="js/budget.js"></script>

</body>
</html>
