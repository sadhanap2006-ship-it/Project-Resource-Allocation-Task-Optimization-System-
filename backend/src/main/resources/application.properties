# =====================================================================
#  Project Resource Allocation System - application settings
# =====================================================================

# Hosting services tell the application which port to use through the PORT
# environment variable. When it is not set we fall back to 8080, so running
# it on your own machine is unchanged.
server.port=${PORT:8080}
spring.application.name=resource-allocation-system

# ---------- MySQL connection ----------
# Change the username / password to match your own MySQL installation.
# Each setting reads an environment variable first and falls back to the
# local default after the colon. So on your own machine nothing changes,
# and on a hosting service you just set DB_URL, DB_USERNAME and DB_PASSWORD
# instead of editing this file. A password should never be committed to git.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/resource_allocation_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "none" means Hibernate never changes the tables. The tables are created
# by database/schema.sql, which is the single source of truth for the design.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JSON ----------
# Send dates as "2026-09-18" instead of an array of numbers.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Static frontend ----------
spring.web.resources.add-mappings=true

# ---------- Optional password gate (see docs/deployment.md) ----------
# Leave these EMPTY for local use and the site is open, exactly as before.
# Set both before putting the site on the public internet: every page and
# every API call then asks for this one username and password, which you
# give to your examiner.
app.access.username=${ACCESS_USERNAME:}
app.access.password=${ACCESS_PASSWORD:}
