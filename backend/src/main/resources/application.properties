# =====================================================================
#  Project Resource Allocation System - application settings
# =====================================================================

server.port=8080
spring.application.name=resource-allocation-system

# ---------- MySQL connection ----------
# Change the username / password to match your own MySQL installation.
spring.datasource.url=jdbc:mysql://localhost:3306/resource_allocation_db?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---------- JPA / Hibernate ----------
# "none" means Hibernate never changes the tables. The tables are created
# by database/schema.sql, which is the single source of truth for the design.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ---------- JSON ----------
# Send dates as "2026-09-18" instead of an array of numbers.
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Static frontend ----------
spring.web.resources.add-mappings=true
