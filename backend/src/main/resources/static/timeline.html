<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Timeline & Gantt - Resource Optimizer</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
  <style>
    .gantt-chart-container {
      position: relative;
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      background: var(--bg-card);
      overflow-x: auto;
    }
    .gantt-grid {
      display: grid;
      position: relative;
      min-width: 900px;
    }
    .gantt-header {
      display: contents;
    }
    .gantt-header-cell {
      padding: 0.6rem 0.25rem;
      background: var(--bg-surface);
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.7rem;
      text-align: center;
      color: var(--text-muted);
      font-weight: 600;
    }
    .gantt-row {
      display: contents;
    }
    .gantt-label {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid var(--border-color);
      background: var(--bg-card);
      position: sticky;
      left: 0;
      z-index: 3;
      font-weight: 500;
      white-space: nowrap;
    }
    .gantt-cell {
      border-bottom: 1px solid var(--border-color);
      border-right: 1px solid rgba(255, 255, 255, 0.05);
      position: relative;
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div id="app-header-container"></div>

    <main class="main-content">
      <div class="page-header">
        <div class="page-title-group">
          <h1>Project Timeline & Resource Gantt</h1>
          <p>Interactive schedule lanes with milestone progress, delivery forecasts, and conflict bands</p>
        </div>
        <div class="page-actions">
          <div class="tab-nav" style="border:none; margin:0;">
            <button class="tab-btn active" id="tab-milestones">Milestone Gantt</button>
            <button class="tab-btn" id="tab-resources">Resource Lanes</button>
          </div>
          <select id="select-project" class="form-control" style="min-width: 200px;">
          </select>
        </div>
      </div>

      <div id="loading-state"></div>
      <div id="timeline-container" style="display: none;">
        <div class="card" style="margin-bottom: 1.5rem;">
          <div class="card-header">
            <h3 class="card-title" id="timeline-title">Gantt View</h3>
            <div style="display:flex; gap:1rem; font-size:0.75rem; align-items:center;">
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:12px; height:12px; background:var(--primary); border-radius:2px;"></span> In Progress</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:12px; height:12px; background:var(--success); border-radius:2px;"></span> Completed</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:12px; height:12px; background:#64748b; border-radius:2px;"></span> Planned</span>
              <span style="display:flex; align-items:center; gap:4px;"><span style="width:12px; height:12px; background:rgba(239, 68, 68, 0.3); border:1px dashed var(--danger); border-radius:2px;"></span> Conflict Band</span>
            </div>
          </div>

          <div class="gantt-chart-container" id="gantt-wrapper">
            <!-- Dynamically rendered CSS Grid Gantt -->
          </div>
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { requireAuth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await requireAuth(['PM', 'ADMIN']);

    let activeView = 'MILESTONES'; // MILESTONES or RESOURCES
    let projects = [];
    let currentProjectId = null;

    const params = new URLSearchParams(window.location.search);
    const initialProjectId = params.get('projectId');

    async function init() {
      try {
        projects = await api.get('/projects');
        const select = document.getElementById('select-project');
        select.innerHTML = projects.map(p => `
          <option value="${p.id}" ${initialProjectId && String(p.id) === String(initialProjectId) ? 'selected' : ''}>
            ${ui.escapeHtml(p.name)} (${p.code})
          </option>
        `).join('');

        currentProjectId = select.value;
        select.onchange = () => {
          currentProjectId = select.value;
          loadTimeline();
        };

        document.getElementById('tab-milestones').onclick = () => {
          activeView = 'MILESTONES';
          document.getElementById('tab-milestones').classList.add('active');
          document.getElementById('tab-resources').classList.remove('active');
          document.getElementById('select-project').style.display = 'block';
          loadTimeline();
        };

        document.getElementById('tab-resources').onclick = () => {
          activeView = 'RESOURCES';
          document.getElementById('tab-resources').classList.add('active');
          document.getElementById('tab-milestones').classList.remove('active');
          document.getElementById('select-project').style.display = 'none';
          loadTimeline();
        };

        loadTimeline();
      } catch (err) {
        ui.showToast(err.message, 'error');
      }
    }

    async function loadTimeline() {
      const loadState = document.getElementById('loading-state');
      const content = document.getElementById('timeline-container');
      ui.renderLoading(loadState, 'Rendering timeline bars...');

      try {
        loadState.style.display = 'none';
        content.style.display = 'block';

        if (activeView === 'MILESTONES') {
          await renderMilestonesGantt();
        } else {
          await renderResourceLanesGantt();
        }
      } catch (err) {
        ui.renderError(loadState, err, loadTimeline);
      }
    }

    async function renderMilestonesGantt() {
      const res = await api.get(`/projects/${currentProjectId}/timeline`);
      document.getElementById('timeline-title').innerText = `${res.projectName} · Milestone Gantt`;

      const wrapper = document.getElementById('gantt-wrapper');
      if (!res.milestones || res.milestones.length === 0) {
        wrapper.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-subtle);">No milestones for this project.</div>';
        return;
      }

      // Compute timeline range
      const startDates = res.milestones.map(m => new Date(m.startDate).getTime());
      const endDates = res.milestones.map(m => new Date(m.forecastFinishDate || m.endDate).getTime());
      const minTime = Math.min(...startDates);
      const maxTime = Math.max(...endDates);
      const totalSpanDays = Math.max(30, Math.ceil((maxTime - minTime) / (1000 * 60 * 60 * 24)) + 5);

      const startDateObj = new Date(minTime);

      let html = `
        <div style="padding:1rem;">
          <table class="data-table" style="width:100%;">
            <thead>
              <tr>
                <th style="width:220px;">Milestone</th>
                <th style="width:140px;">Timeline</th>
                <th style="width:120px;">Forecast Finish</th>
                <th>Progress & Timeline Bar</th>
              </tr>
            </thead>
            <tbody>
      `;

      res.milestones.forEach(m => {
        const mStart = new Date(m.startDate).getTime();
        const mEnd = new Date(m.endDate).getTime();
        const leftPct = Math.max(0, ((mStart - minTime) / (1000 * 60 * 60 * 24)) / totalSpanDays * 100);
        const widthPct = Math.max(5, ((mEnd - mStart) / (1000 * 60 * 60 * 24)) / totalSpanDays * 100);

        const statusColor = m.status === 'COMPLETED' ? 'var(--success)' : m.status === 'IN_PROGRESS' ? 'var(--primary)' : '#64748b';
        const delayBadge = m.delayDays > 0 ? `<span class="badge badge-red">+${m.delayDays}d</span>` : `<span class="badge badge-green">On Schedule</span>`;

        html += `
          <tr>
            <td>
              <div style="font-weight:600;">${ui.escapeHtml(m.name)}</div>
              <div style="font-size:0.75rem; color:var(--text-subtle);">${m.assignedResources.join(', ') || 'Unstaffed'}</div>
            </td>
            <td style="font-size:0.8rem;">${ui.formatDate(m.startDate)} → ${ui.formatDate(m.endDate)}</td>
            <td style="font-size:0.8rem;">
              ${m.forecastFinishDate ? ui.formatDate(m.forecastFinishDate) : '-'} ${delayBadge}
            </td>
            <td>
              <div style="background:var(--bg-surface); height:32px; border-radius:4px; position:relative; overflow:hidden;">
                <div style="position:absolute; left:${leftPct}%; width:${widthPct}%; height:100%; background:${statusColor}; opacity:0.3; border-radius:4px;"></div>
                <div style="position:absolute; left:${leftPct}%; width:${(widthPct * m.progressPct / 100)}%; height:100%; background:${statusColor}; border-radius:4px; display:flex; align-items:center; padding:0 8px; color:white; font-size:11px; font-weight:700;">
                  ${m.progressPct}%
                </div>
              </div>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      wrapper.innerHTML = html;
    }

    async function renderResourceLanesGantt() {
      document.getElementById('timeline-title').innerText = 'Cross-Project Developer Lanes';
      const wrapper = document.getElementById('gantt-wrapper');

      const res = await api.get('/timeline/resources?type=DEVELOPER');
      if (!res.resources || res.resources.length === 0) {
        wrapper.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-subtle);">No developer allocations found.</div>';
        return;
      }

      let html = `
        <div style="padding:1rem;">
          <table class="data-table" style="width:100%;">
            <thead>
              <tr>
                <th style="width:180px;">Developer</th>
                <th>Allocations & Overlap Conflicts</th>
              </tr>
            </thead>
            <tbody>
      `;

      res.resources.forEach(r => {
        html += `
          <tr>
            <td>
              <div style="font-weight:600;">${ui.escapeHtml(r.resourceName)}</div>
              <div style="font-size:0.75rem; color:var(--text-subtle);">${r.allocations.length} allocation(s)</div>
            </td>
            <td>
              <div style="display:flex; flex-direction:column; gap:0.4rem;">
                ${r.allocations.map(a => `
                  <div style="background:var(--primary-surface); border:1px solid rgba(59, 130, 246, 0.4); padding:4px 8px; border-radius:4px; font-size:0.8rem; display:flex; justify-content:space-between;">
                    <span><strong>${ui.escapeHtml(a.projectName)}</strong> · ${ui.escapeHtml(a.milestoneName)} (${a.allocationPct}%)</span>
                    <span style="color:var(--text-muted);">${ui.formatDate(a.startDate)} → ${ui.formatDate(a.endDate)}</span>
                  </div>
                `).join('')}

                ${r.conflictBands.map(c => `
                  <div style="background:var(--danger-surface); border:1px solid rgba(239, 68, 68, 0.5); padding:4px 8px; border-radius:4px; font-size:0.8rem; color:#fca5a5;">
                    <strong>[${c.severity}] ${ui.escapeHtml(c.type)}</strong> - ${ui.escapeHtml(c.description)} (${ui.formatDate(c.startDate)} → ${ui.formatDate(c.endDate)})
                  </div>
                `).join('')}
              </div>
            </td>
          </tr>
        `;
      });

      html += '</tbody></table></div>';
      wrapper.innerHTML = html;
    }

    init();
  </script>
</body>
</html>
