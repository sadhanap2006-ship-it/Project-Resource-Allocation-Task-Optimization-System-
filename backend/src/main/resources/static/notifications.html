<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications - Resource Optimizer</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/layout.css">
  <link rel="stylesheet" href="/css/components.css">
</head>
<body>
  <div class="app-wrapper">
    <div id="app-header-container"></div>

    <main class="main-content">
      <div class="page-header">
        <div class="page-title-group">
          <h1>Notifications & Alerts</h1>
          <p>System alerts, newly detected conflicts, and schedule warnings</p>
        </div>
        <div class="page-actions">
          <button id="btn-mark-all-read" class="btn btn-secondary">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Mark All as Read
          </button>
        </div>
      </div>

      <div class="card">
        <div id="loading-state"></div>
        <div id="notifications-container" style="display:flex; flex-direction:column; gap:0.75rem;">
        </div>
      </div>
    </main>
  </div>

  <script type="module">
    import { api } from '/js/api.js';
    import { requireAuth } from '/js/auth.js';
    import { ui } from '/js/ui.js';

    await requireAuth();

    async function loadNotifications() {
      const loadState = document.getElementById('loading-state');
      const container = document.getElementById('notifications-container');
      ui.renderLoading(loadState, 'Loading notifications...');

      try {
        const notifs = await api.get('/notifications');
        loadState.style.display = 'none';
        renderList(notifs);
      } catch (err) {
        ui.renderError(loadState, err, loadNotifications);
      }
    }

    function renderList(list) {
      const container = document.getElementById('notifications-container');
      if (!list || list.length === 0) {
        container.innerHTML = '<div style="text-align:center; padding:3rem; color:var(--text-subtle);">No notifications found.</div>';
        return;
      }

      container.innerHTML = list.map(n => {
        const borderCol = n.severity === 'CRITICAL' ? 'var(--danger)' : n.severity === 'HIGH' ? 'var(--warning)' : 'var(--primary)';
        const bg = n.isRead ? 'var(--bg-surface)' : 'rgba(59, 130, 246, 0.08)';

        return `
          <div style="background:${bg}; padding:1rem; border-radius:var(--radius-md); border-left:4px solid ${borderCol}; display:flex; justify-content:space-between; align-items:flex-start; gap:1rem;">
            <div>
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
                <strong>${ui.escapeHtml(n.title)}</strong>
                <span class="badge ${n.severity === 'CRITICAL' ? 'badge-red' : n.severity === 'HIGH' ? 'badge-amber' : 'badge-blue'}">${n.severity}</span>
                ${!n.isRead ? '<span class="badge badge-primary" style="font-size:0.65rem;">NEW</span>' : ''}
              </div>
              <p style="margin:0; font-size:0.875rem; color:var(--text-main);">${ui.escapeHtml(n.message)}</p>
              <div style="font-size:0.75rem; color:var(--text-subtle); margin-top:0.4rem;">${ui.formatDate(n.createdAt)}</div>
            </div>
            <div>
              ${!n.isRead ? `
                <button class="btn btn-secondary btn-sm btn-mark-read" data-id="${n.id}">Mark Read</button>
              ` : ''}
            </div>
          </div>
        `;
      }).join('');

      document.querySelectorAll('.btn-mark-read').forEach(btn => {
        btn.onclick = async () => {
          try {
            await api.put(`/notifications/${btn.dataset.id}/read`);
            loadNotifications();
          } catch (err) {
            ui.showToast(err.message, 'error');
          }
        };
      });
    }

    document.getElementById('btn-mark-all-read').onclick = async () => {
      try {
        await api.put('/notifications/read-all');
        ui.showToast('All notifications marked as read.', 'success');
        loadNotifications();
      } catch (err) {
        ui.showToast(err.message, 'error');
      }
    };

    loadNotifications();
  </script>
</body>
</html>
